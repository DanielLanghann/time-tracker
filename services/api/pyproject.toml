[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

# Migrations are generated by Django and must stay as generated, so they are
# exempt from formatting and from the rules Django's output does not follow.
# Hand-written migration code is still checked by all other rules.
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["I001", "RUF012"]

[tool.ruff.format]
exclude = ["**/migrations/*.py"]
